<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <title>Queue Dashboard</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="admin">
  <!-- Password gate -->
  <div class="auth" id="gate" hidden>
    <div class="auth-inner">
      <img src="/icon.svg" alt="" class="auth-logo">
      <h1>Dashboard</h1>
      <form id="gate-form">
        <label class="auth-label" for="gate-pw">Dashboard password</label>
        <input class="field" id="gate-pw" type="password" autocomplete="current-password">
        <p class="auth-error" id="gate-error" role="alert"></p>
        <button class="btn-green" type="submit">Open dashboard</button>
      </form>
      <div class="auth-switch"><a href="/" style="color:var(--text);font-weight:700">Back to the app</a></div>
    </div>
  </div>

  <div class="dash" id="dash" hidden>
    <aside class="side">
      <a class="brand" href="/"><img src="/icon.svg" alt=""><span>Class Queue</span></a>
      <nav class="side-nav" aria-label="Dashboard sections">
        <a href="#overview" class="active">Overview</a>
        <a href="#queue">Queue</a>
        <a href="#members">Members</a>
        <a href="#settings">Settings</a>
        <a href="#activity">Activity</a>
      </nav>
      <div class="side-foot">
        <span class="live-dot" id="live-dot"></span><span id="live-text">Connecting…</span>
        <button class="link" id="lock-btn">Lock dashboard</button>
      </div>
    </aside>

    <main class="dash-main">
      <section id="overview">
        <h1 class="dash-title">Overview</h1>
        <div class="tiles" id="tiles"></div>
        <div class="now-wrap" id="dash-now"></div>
      </section>

      <section id="queue">
        <div class="sec-head">
          <h2>Queue</h2>
          <div class="sec-actions">
            <button class="btn-outline sm" data-act="copy">Copy list</button>
            <button class="btn-outline sm danger" data-act="clear-queue">Clear queue</button>
          </div>
        </div>
        <div class="table-wrap"><table class="tbl" id="queue-tbl"></table></div>
        <details class="history" id="played-wrap">
          <summary>Recently played</summary>
          <div class="table-wrap"><table class="tbl" id="played-tbl"></table></div>
          <button class="link" data-act="clear-history" style="margin-top:10px">Clear recently played</button>
        </details>
      </section>

      <section id="members">
        <div class="sec-head">
          <h2>Members <span class="count" id="member-count"></span></h2>
          <input class="field sm" id="member-search" type="search" placeholder="Search members" aria-label="Search members">
        </div>
        <div class="table-wrap"><table class="tbl" id="members-tbl"></table></div>
      </section>

      <section id="settings">
        <h2>Settings</h2>
        <div class="settings-grid" id="settings-box"></div>
      </section>

      <section id="activity">
        <div class="sec-head">
          <h2>Activity</h2>
          <button class="link" data-act="clear-log">Clear</button>
        </div>
        <ol class="feed" id="feed"></ol>
      </section>
    </main>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="sheet-handle"></div>
    <div id="sheet-body"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/admin.js" type="module"></script>
</body>
</html>
